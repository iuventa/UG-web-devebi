<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <title>Fuel</title>
</head>
<body>
    <header>
        <div class="flex operator">
            <input type="number" name="amount" id="amount" placeholder="ჩაწერეთ საწვავის რაოდენობა">
            <p class="approve" ondblclick="fuel()">დადასტურება</p>
        </div>
    </header>
    <main>
        <div class="flex trafaretebi">
            <div class="trafareti">
                <p class="cityname">თბილისი</p>
                <div class="joxi"></div>
            </div>
            <div class="trafareti">
                <p class="cityname" id="gori">კატლეტი</p>
                <div class="joxi"></div>
            </div>
            <div class="trafareti">
                <p class="cityname" id="khashuri">ჰამაკი</p>
                <div class="joxi"></div>
            </div>
            <div class="trafareti">
                <p class="cityname" id="kutaisi">ქუჩა</p>
                <div class="joxi"></div>
            </div>
            <div class="trafareti">
                <p class="cityname" id="batumi">ზღვა</p>
                <div class="joxi"></div>
            </div>
        </div>
    </main>
    <footer>
        <div class="car" id="car">
            <img src="assets/img/supercar.png" alt="">
        </div>
    </footer>
    <script src="js/scripts.js"></script>
</body>
</html>
