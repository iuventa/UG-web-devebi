<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <title>My Calculator</title>
</head>
<body>
    <header></header>
    <main>
        <div class="calculatorContainer">
            <div class="calcHeader">
                <p class="gamosaxuleba" id="gamosaxuleba"></p>
                <p class="answer" id="answer">0</p>
            </div>
            <div class="calcMain flex">
                <p class="btn flex" id="clearLastCharachter">&#8678;</p>
                <p class="btn flex" id="ac">AC</p>
                <p class="btn actionbtn flex" >&percnt;</p>
                <p class="btn actionbtn flex orange" >&divide;</p>
                <p class="btn actionbtn flex" >7</p>
                <p class="btn actionbtn flex" >8</p>
                <p class="btn actionbtn flex" >9</p>
                <p class="btn actionbtn flex orange" >&times;</p>
                <p class="btn actionbtn flex" >4</p>
                <p class="btn actionbtn flex" >5</p>
                <p class="btn actionbtn flex" >6</p>
                <p class="btn actionbtn flex orange" >&minus;</p>
                <p class="btn actionbtn flex" >1</p>
                <p class="btn actionbtn flex" >2</p>
                <p class="btn actionbtn flex" >3</p>
                <p class="btn actionbtn flex orange" >&plus;</p>
                <p class="btn flex" id="plsmn">&plusmn;</p>
                <p class="btn actionbtn flex" >0</p>
                <p class="btn actionbtn flex" >&period;</p>
                <p class="btn flex orange" id="equals">&equals;</p>
            </div>
        </div>
    </main>
    <footer></footer>
    <script src="js/ac.js"></script>
    <script src="js/gamosaxuleba.js"></script>
    <script src="js/calulate.js"></script>
    <script src="js/washla.js"></script>
    <script src="js/plsmn.js"></script>
</body>
</html>
