<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <title>Template</title>
</head>
<body>
    <header>
        <p id="mode">
            <i class="fa-solid fa-toggle-on"></i>
        </p>
    </header>
    <main>
        <div class="flex statiebi" id="statiebi">
        </div>
        <div class="text">
            <h3 class="center h3">Try by yourself</h3>
            <p class="center">The computer will think of a random number. You have to guess it. Try your best!</p>
        </div>
        <div class="flex inputina">
            <input type="number" name="number" id="number" placeholder="Write number here">
            <p class="check" id="check">CHECK</p>
        </div>
        <p class="answer center" id="answer">Well Done! The random number is: 6</p>
    </main>
    <footer></footer>
    <script src="https://kit.fontawesome.com/890d120cdd.js" ></script>
    <script src="js/scripts.js"></script>
    <script src="js/ricxvi.js"></script>
    <script src="js/mode.js"></script>
</body>
</html>
